<script>
(()=>{'use strict';const KEY='bano-planner-v1',areas=['فرزند','همسرداری','شغل','رشد من','مراقبت'],care=['ورزش','تغذیه','سلامت','زیبایی','معنویت'],priorities=['کم','معمولی','زیاد'],occasions={'1-1':'آغاز رمضان','10-1':'عاشورا','20-2':'اربعین','1-10':'عید فطر','10-12':'عید قربان','18-12':'عید غدیر','15-8':'نیمه شعبان'},now=new Date();let state={tasks:[]},selected=iso(now),tab='today',picker=false,pickerMonth=null,weekOffset=0,reportType='daily',priorityFilter='high',reportMonthOffset=0;const $=s=>document.querySelector(s),app=$('#app'),portal=$('#portal');function load(){try{let x=localStorage.getItem(KEY);if(x){let j=JSON.parse(x);if(!j||j.schema!==1||!Array.isArray(j.tasks))throw Error('ساختار داده معتبر نیست');state=j}}catch(e){state={tasks:[]};setTimeout(()=>alert('داده‌های ذخیره‌شده خوانده نشدند. ممکن است فضای ذخیره‌سازی مرورگر در دسترس نباشد.'),50)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('ذخیره‌سازی انجام نشد؛ فضای مرورگر یا دسترسی localStorage را بررسی کنید.');return false}}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function parse(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function addDays(s,n){let d=parse(s);d.setDate(d.getDate()+n);return iso(d)}function pers(s,opts={dateStyle:'full'}){return new Intl.DateTimeFormat('fa-IR-u-ca-persian',opts).format(parse(s))}function persParts(s){return new Intl.DateTimeFormat('en-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(parse(s)).reduce((o,p)=>(o[p.type]=+p.value,o),{})}function hijri(s){return new Intl.DateTimeFormat('fa-IR-u-ca-islamic-umalqura',{day:'numeric',month:'long'}).format(parse(s))}function escape(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dayOcc(s){let p=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric'}).formatToParts(parse(s)),o={};p.forEach(x=>{if(x.type==='day'||x.type==='month')o[x.type]=+x.value});return occasions[`${o.day}-${o.month}`]||''}function weekStart(s){let d=parse(s);d.setDate(d.getDate()-((d.getDay()+1)%7));return iso(d)}function monthStart(s){let p=persParts(s);return p}
$('#headerDate').textContent=pers(selected,{dateStyle:'medium'});function setDate(s){selected=s;picker=false;render()}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#headerDate').textContent=pers(selected,{dateStyle:'medium'});if(tab==='today')todayView();if(tab==='week')weekView();if(tab==='priority')priorityView();if(tab==='report')reportView()}function taskCard(t){return `<article class="task ${t.done?'done':''}"><div class="taskrow"><input class="check" type="checkbox" aria-label="تغییر وضعیت ${escape(t.title)}" data-check="${escape(t.id)}" ${t.done?'checked':''}><div class="taskbody"><div class="tasktitle">${escape(t.title)}</div><div class="meta"><span class="tag">${escape(t.area)}${t.sub?` · ${escape(t.sub)}`:''}</span><span class="tag ${t.priority==='زیاد'?'urgent':''}">اولویت ${escape(t.priority)}</span>${t.estimate?`<span>برآورد ${t.estimate} دقیقه</span>`:''}${t.actual?`<span>مدت واقعی ${t.actual} دقیقه</span>`:''}</div></div><div class="taskactions"><button class="mini" data-edit="${escape(t.id)}" aria-label="ویرایش">✎</button><button class="mini" data-detail="${escape(t.id)}" aria-label="جزئیات و دیدگاه‌ها">⋯</button></div></div>${t.note?`<div class="tasknote">${escape(t.note)}</div>`:''}${t.comments?.length?`<div class="comments">${t.comments.map(c=>`<div class="comment">${escape(c.text)} <time>${escape(c.at)}</time></div>`).join('')}</div>`:''}</article>`}function bindTasks(){document.querySelectorAll('[data-check]').forEach(e=>e.onchange=()=>{let t=state.tasks.find(x=>x.id===e.dataset.check);if(t){t.done=e.checked;t.completedAt=t.done?new Date().toISOString():null;save();render()}});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>form(e.dataset.edit));document.querySelectorAll('[data-detail]').forEach(e=>e.onclick=()=>detail(e.dataset.detail))}function occasionHTML(s){let o=dayOcc(s);return o?`<div class="occasion">مناسبت قمری تقریبی: ${escape(o)} · نام‌گذاری بر پایهٔ تقویم ام‌القری است و رسمی/قطعی نیست.</div>`:''}function todayView(){let list=state.tasks.filter(t=>t.date===selected).sort((a,b)=>Number(a.done)-Number(b.done));app.innerHTML=`<div class="toolbar"><button class="btn soft datepill" id="pickBtn">▦ ${escape(pers(selected,{dateStyle:'full'}))}</button><button class="btn tomorrow" id="tomorrow">فردا ←</button></div>${picker?calendarHTML(selected):''}<h1 class="headline">${selected===iso(now)?'امروزت':'برنامهٔ این روز'}</h1><div class="subline">${escape(pers(selected,{dateStyle:'full'}))} · ${escape(hijri(selected))}</div>${occasionHTML(selected)}<button class="btn primary" id="planTomorrow">＋ برنامه‌ریزی فردا</button><button class="btn soft" id="addTask">＋ افزودن کار برای این روز</button>${list.length?list.map(taskCard).join(''):'<div class="empty">برای این روز کاری ثبت نشده است.<br>می‌توانی برنامه‌ات را همین‌جا اضافه کنی.</div>'}<div class="notice">تاریخ‌های قمری تقریبی‌اند و ممکن است با رؤیت هلال در ایران یک روز تفاوت داشته باشند.</div>`;$('#pickBtn').onclick=()=>{picker=!picker;render()};$('#tomorrow').onclick=()=>setDate(addDays(selected,1));$('#planTomorrow').onclick=()=>{selected=addDays(selected,1);form()};$('#addTask').onclick=()=>form();if(picker)bindCalendar();bindTasks()}function calendarHTML(s){let p=persParts(s),year=p.year,month=p.month;if(!pickerMonth||pickerMonth.year!==year||pickerMonth.month!==month)pickerMonth={year,month};let dates=[];for(let delta=-20;delta<=45;delta++){let d=parse(s);d.setDate(d.getDate()+delta);let q=persParts(iso(d));if(q.year===pickerMonth.year&&q.month===pickerMonth.month)dates.push(iso(d))}let first=dates[0],offset=(parse(first).getDay()+1)%7;let cells=Array(offset).fill(null).concat(dates);while(cells.length%7)cells.push(null);return `<div class="calendar"><div class="calendarhead"><button id="prevM" aria-label="ماه قبل">‹</button><b>${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'}).format(parse(first))}</b><button id="nextM" aria-label="ماه بعد">›</button></div><div class="weekdays">${['ش','ی','د','س','چ','پ','ج'].map(x=>`<div class="weekday">${x}</div>`).join('')}</div><div class="grid">${cells.map(x=>{if(!x)return '<div></div>';let q=persParts(x),active=x===selected,today=x===iso(now),has=state.tasks.some(t=>t.date===x);return `<button class="daycell ${active?'selected':''} ${today?'today':''}" data-date="${x}">${q.day}${has?'<i class="dot"></i>':''}</button>`}).join('')}</div></div>`}function shiftPersMonth(n){let d=parse(selected);d.setDate(15);for(let i=0;i<40;i++){d.setDate(d.getDate()+n*7);let p=persParts(iso(d));if(p.month!==pickerMonth.month||p.year!==pickerMonth.year){selected=iso(d);pickerMonth=null;break}}render()}function bindCalendar(){$('#prevM').onclick=()=>shiftPersMonth(-1);$('#nextM').onclick=()=>shiftPersMonth(1);document.querySelectorAll('[data-date]').forEach(e=>e.onclick=()=>setDate(e.dataset.date))}function weekView(){let start=addDays(weekStart(selected),weekOffset*7),days=Array.from({length:7},(_,i)=>addDays(start,i)),end=days[6];app.innerHTML=`<div class="sectionhead"><h2>برنامهٔ هفته</h2><div class="weeknav"><button class="btn soft" id="weekPrev">→</button><span>${escape(pers(start,{dateStyle:'medium'}))} تا ${escape(pers(end,{dateStyle:'medium'}))}</span><button class="btn soft" id="weekNext">←</button></div></div><div class="notice">${escape(hijri(selected))} · مناسبت‌های قمری تقریبی‌اند؛ امکان تفاوت یک‌روزه وجود دارد.</div>${days.map(d=>`<section><div class="sectionhead"><button class="btn soft" data-goto="${d}">${escape(pers(d,{weekday:'long',day:'numeric',month:'long'}))}</button></div>${occasionHTML(d)}${state.tasks.filter(t=>t.date===d).length?state.tasks.filter(t=>t.date===d).map(taskCard).join(''):'<div class="notice">کاری ثبت نشده</div>'}</section>`).join('')}`;$('#weekPrev').onclick=()=>{weekOffset--;render()};$('#weekNext').onclick=()=>{weekOffset++;render()};document.querySelectorAll('[data-goto]').forEach(e=>e.onclick=()=>setDate(e.dataset.goto));bindTasks()}function priorityView(){let old=state.tasks.filter(t=>!t.done&&t.date<iso(now));let list=old.filter(t=>priorityFilter==='all'||t.priority==='زیاد').sort((a,b)=>a.date.localeCompare(b.date));app.innerHTML=`<h1 class="headline">کارهای انجام‌نشده</h1><p class="subline">اولویت‌های گذشته، بدون سرزنش؛ خودت زمان مناسب را انتخاب کن.</p><div class="toolbar"><select id="pfilter" aria-label="فیلتر اولویت"><option value="high" ${priorityFilter==='high'?'selected':''}>اولویت زیاد (پیش‌فرض)</option><option value="all" ${priorityFilter==='all'?'selected':''}>همهٔ اولویت‌ها</option></select></div>${list.length?list.map(t=>`${taskCard(t)}<div class="toolbar"><button class="btn soft" data-reschedule="${t.id}" data-when="today">انتقال به امروز</button><button class="btn soft" data-reschedule="${t.id}" data-when="tomorrow">انتقال به فردا</button></div>`).join(''):'<div class="empty">کار عقب‌افتاده‌ای در این فیلتر نیست.</div>'}`;$('#pfilter').onchange=e=>{priorityFilter=e.target.value;render()};document.querySelectorAll('[data-reschedule]').forEach(e=>e.onclick=()=>{let t=state.tasks.find(x=>x.id===e.dataset.reschedule);t.date=addDays(iso(now),e.dataset.when==='tomorrow'?1:0);save();render()});bindTasks()}function periodTasks(){let d=parse(selected),typ=reportType,year,month,dates=[];if(typ==='daily')dates=[selected];else if(typ==='weekly'){let s=weekStart(selected);dates=Array.from({length:7},(_,i)=>addDays(s,i))}else{let pp=persParts(selected);year=pp.year;month=pp.month;for(let i=-20;i<=45;i++){let x=parse(selected);x.setDate(x.getDate()+i);let q=persParts(iso(x));if(q.year===year&&q.month===month)dates.push(iso(x))}}return {dates,tasks:state.tasks.filter(t=>dates.includes(t.date)),label:typ==='daily'?pers(selected,{dateStyle:'full'}):typ==='weekly'?`هفتهٔ ${pers(d,{month:'long',year:'numeric'})}`:`${new Intl.DateTimeFormat('fa-IR-u-ca-persian',{month:'long',year:'numeric'}).format(d)}`}}function reportView(){let p=periodTasks(),all=p.tasks,done=all.filter(t=>t.done),mins=done.reduce((n,t)=>n+(Number(t.actual)||0),0);let groups=areas.map(a=>{let xs=all.filter(t=>t.area===a);return {a,n:xs.length,d:xs.filter(t=>t.done).length}});app.innerHTML=`<div class="sectionhead"><h2>گزارش</h2><div class="reportcontrols"><select id="rtype" aria-label="دورهٔ گزارش"><option value="daily">روزانه</option><option value="weekly">هفتگی</option><option value="monthly">ماهانه</option></select><button class="btn soft" id="reportPick">▦ تاریخ</button></div></div>${picker?calendarHTML(selected):''}<p class="subline">${escape(p.label)} · ${escape(pers(selected,{dateStyle:'medium'}))}</p><div class="stats"><div class="stat"><b>${done.length}/${all.length}</b>انجام‌شده از کل</div><div class="stat"><b>${all.length-done.length}</b>در انتظار</div><div class="stat"><b>${mins}</b>دقیقهٔ واقعی</div></div><h3>به تفکیک حوزه</h3>${groups.map(g=>`<div class="barrow"><span>${g.a}</span><div class="barbg"><div class="barfill" style="width:${g.n?g.d/g.n*100:0}%"></div></div><span>${g.d}/${g.n}</span></div>`).join('')}<div class="sectionhead"><h3>همهٔ کارهای دوره</h3><button class="btn primary" id="exportPng">خروجی عکس</button></div>${all.length?all.sort((a,b)=>a.date.localeCompare(b.date)).map(t=>`<div class="task"><div class="tasktitle">${t.done?'✓':'○'} ${escape(t.title)}</div><div class="meta"><span>${escape(pers(t.date,{dateStyle:'medium'}))}</span><span class="tag">${escape(t.area)}</span><span>${t.done?'انجام‌شده':'در انتظار'}</span>${t.actual?`<span>${t.actual} دقیقهٔ واقعی</span>`:''}</div></div>`).join(''):'<div class="empty">در این دوره هنوز کاری ثبت نشده است.</div>'}`;$('#rtype').value=reportType;$('#rtype').onchange=e=>{reportType=e.target.value;render()};$('#reportPick').onclick=()=>{picker=!picker;render()};if(picker)bindCalendar();$('#exportPng').onclick=()=>exportPNG(p,all,done,mins)}

function form(id){let t=id?state.tasks.find(x=>x.id===id):null;portal.innerHTML=`<div class="modalback" id="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><h2 id="formTitle">${t?'ویرایش کار':'افزودن کار'}</h2><form id="taskForm"><div class="formgrid"><div class="field full"><label for="ftitle">عنوان کار *</label><input id="ftitle" required maxlength="140" value="${escape(t?.title||'')}" placeholder="مثلاً زمان بازی با فرزند"></div><div class="field"><label for="fdate">تاریخ شمسی *</label><input id="fdate" type="text" value="${escape(pers(t?.date||selected,{dateStyle:'short'}))}" readonly><input id="fiso" type="hidden" value="${escape(t?.date||selected)}"><button type="button" class="btn soft" id="formDate">انتخاب تاریخ</button></div><div class="field"><label for="farea">حوزه *</label><select id="farea">${areas.map(a=>`<option ${t?.area===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field" id="subwrap"><label for="fsub">زیرحوزهٔ مراقبت</label><select id="fsub"><option value="">انتخاب کنید</option>${care.map(a=>`<option ${t?.sub===a?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label for="fpriority">اولویت</label><select id="fpriority">${priorities.map(a=>`<option ${((t?.priority||'معمولی')===a)?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label for="festimate">زمان برآوردی (دقیقه)</label><input id="festimate" type="number" min="0" max="100000" inputmode="numeric" value="${escape(t?.estimate??'')}"></div><div class="field"><label for="factual">زمان واقعی (دقیقه)</label><input id="factual" type="number" min="0" max="100000" inputmode="numeric" value="${escape(t?.actual??'')}"></div><div class="field full"><label for="fnote">یادداشت</label><textarea id="fnote" maxlength="2000">${escape(t?.note||'')}</textarea></div></div><div class="modalactions">${t?'<button type="button" class="btn danger" id="deleteTask">حذف کار</button>':''}<button type="button" class="btn soft" id="cancelForm">انصراف</button><button class="btn primary" type="submit">ذخیره</button></div></form></section></div>`;function updateSub(){let careOn=$('#farea').value==='مراقبت';$('#subwrap').style.display=careOn?'flex':'none';if(!careOn)$('#fsub').value=''}$('#farea').onchange=updateSub;updateSub();$('#cancelForm').onclick=()=>portal.innerHTML='';$('#backdrop').onclick=e=>{if(e.target.id==='backdrop')portal.innerHTML=''};$('#formDate').onclick=()=>{let m=document.createElement('div');m.className='modalback';m.innerHTML=`<section class="modal"><h2>انتخاب تاریخ شمسی</h2><div id="formcal"></div><button class="btn soft" id="closeCal">بستن</button></section>`;portal.append(m);let old=selected;selected=$('#fiso').value;pickerMonth=null;m.querySelector('#formcal').innerHTML=calendarHTML(selected);m.querySelector('#closeCal').onclick=()=>{selected=old;m.remove()};m.querySelectorAll('#formcal [data-date]').forEach(b=>b.onclick=()=>{let val=b.dataset.date;$('#fiso').value=val;$('#fdate').value=pers(val,{dateStyle:'short'});selected=old;m.remove()});m.querySelector('#prevM').onclick=()=>{selected=$('#fiso').value;shiftPersMonth(-1);m.querySelector('#formcal').innerHTML=calendarHTML(selected);bindModalCal(m)};m.querySelector('#nextM').onclick=()=>{selected=$('#fiso').value;shiftPersMonth(1);m.querySelector('#formcal').innerHTML=calendarHTML(selected);bindModalCal(m)}};function bindModalCal(m){m.querySelectorAll('#formcal [data-date]').forEach(b=>b.onclick=()=>{let val=b.dataset.date;$('#fiso').value=val;$('#fdate').value=pers(val,{dateStyle:'short'});selected=old;m.remove()})}$('#taskForm').onsubmit=e=>{e.preventDefault();let title=$('#ftitle').value.trim();if(!title){$('#ftitle').focus();return}let x={id:t?.id||crypto.randomUUID?.()||String(Date.now()),title,date:$('#fiso').value,area:$('#farea').value,sub:$('#farea').value==='مراقبت'?$('#fsub').value:'',priority:$('#fpriority').value,estimate:$('#festimate').value===''?'':Number($('#festimate').value),actual:$('#factual').value===''?'':Number($('#factual').value),note:$('#fnote').value.trim(),done:t?.done||false,completedAt:t?.completedAt||null,comments:t?.comments||[]};if(t)Object.assign(t,x);else state.tasks.push(x);save();portal.innerHTML='';selected=x.date;render()};if(t)$('#deleteTask').onclick=()=>{if(confirm('این کار حذف شود؟ امکان بازگردانی وجود ندارد.')){state.tasks=state.tasks.filter(x=>x.id!==t.id);save();portal.innerHTML='';render()}};$('#ftitle').focus()}function detail(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;portal.innerHTML=`<div class="modalback" id="detailback"><section class="modal" role="dialog" aria-modal="true"><h2>${escape(t.title)}</h2><p>${escape(pers(t.date,{dateStyle:'full'}))} · ${escape(t.area)} · ${escape(t.priority)}</p>${t.note?`<p>${escape(t.note)}</p>`:''}<h3>دیدگاه‌های من</h3><div id="detailcomments">${(t.comments||[]).map(c=>`<div class="comment">${escape(c.text)} <time>${escape(c.at)}</time></div>`).join('')||'<div class="notice">هنوز دیدگاهی ثبت نشده است.</div>'}</div><div class="field"><label for="newcomment">افزودن دیدگاه</label><textarea id="newcomment" maxlength="1000" placeholder="یادداشت کوتاه برای خودت"></textarea></div><div class="modalactions"><button class="btn soft" id="closeDetail">بستن</button><button class="btn primary" id="saveComment">ثبت دیدگاه</button><button class="btn soft" id="editFromDetail">ویرایش کار</button></div></section></div>`;$('#closeDetail').onclick=()=>portal.innerHTML='';$('#detailback').onclick=e=>{if(e.target.id==='detailback')portal.innerHTML=''};$('#saveComment').onclick=()=>{let text=$('#newcomment').value.trim();if(!text)return;t.comments=t.comments||[];t.comments.push({text,at:new Intl.DateTimeFormat('fa-IR',{dateStyle:'short',timeStyle:'short'}).format(new Date())});save();detail(id)};$('#editFromDetail').onclick=()=>form(id)}function settings(){portal.innerHTML=`<div class="modalback" id="settingsback"><section class="modal" role="dialog" aria-modal="true"><h2>تنظیمات و داده‌های بانو</h2><p class="subline">اطلاعات فقط روی همین دستگاه و در مرورگر شما ذخیره می‌شود؛ همگام‌سازی آنلاین وجود ندارد.</p><div class="settingsrow"><button class="btn primary" id="backup">بارگیری پشتیبان JSON</button></div><div class="settingsrow"><button class="btn soft" id="chooseImport">بازیابی از پشتیبان JSON</button></div><div class="settingsrow notice">پیش از بازیابی، داده‌های فعلی را در صورت نیاز پشتیبان بگیرید. بازیابی جایگزین کامل است.</div><div class="modalactions"><button class="btn soft" id="closeSettings">بستن</button></div></section></div>`;$('#closeSettings').onclick=()=>portal.innerHTML='';$('#settingsback').onclick=e=>{if(e.target.id==='settingsback')portal.innerHTML=''};$('#backup').onclick=()=>{let blob=new Blob([JSON.stringify({schema:1,exportedAt:new Date().toISOString(),tasks:state.tasks},null,2)],{type:'application/json'});download(blob,'bano-backup-'+iso(now)+'.json')};$('#chooseImport').onclick=()=>$('#importFile').click()}function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}$('#importFile').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{let x=JSON.parse(await f.text());if(x.schema!==1||!Array.isArray(x.tasks)||!x.tasks.every(validTask))throw Error('ساختار پشتیبان معتبر نیست');if(!confirm(`جایگزینی داده‌های فعلی با ${x.tasks.length} کار؟ این عمل برگشت‌پذیر نیست.`))return;state={tasks:x.tasks};save();portal.innerHTML='';render();alert('پشتیبان بازیابی شد.')}catch(err){alert('فایل پشتیبان معتبر نیست یا خوانده نشد.')}};function validTask(t){if(!t||typeof t!=='object'||typeof t.id!=='string'||typeof t.title!=='string'||!t.title.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||!areas.includes(t.area)||!priorities.includes(t.priority)||typeof t.done!=='boolean'||(t.sub&&!(t.area==='مراقبت'&&care.includes(t.sub))))return false;let d=parse(t.date);if(iso(d)!==t.date)return false;for(let k of ['estimate','actual'])if(t[k]!==undefined&&t[k]!==''&&(!Number.isFinite(t[k])||t[k]<0))return false;if(t.note!==undefined&&typeof t.note!=='string')return false;if(t.comments!==undefined&&(!Array.isArray(t.comments)||!t.comments.every(c=>c&&typeof c.text==='string'&&typeof c.at==='string')))return false;return true}function exportPNG(p,all,done,mins){let c=document.createElement('canvas'),ctx=c.getContext('2d'),w=1000,pad=64,line=40,groups=areas.map(a=>({a,n:all.filter(t=>t.area===a).length,d:all.filter(t=>t.area===a&&t.done).length}));let lines=[['بانو | گزارش برنامه‌ریزی',32,true],[p.label,22,false],[`انجام‌شده: ${done.length} از ${all.length}     در انتظار: ${all.length-done.length}     زمان واقعی: ${mins} دقیقه`,19,false],['',16,false],['به تفکیک حوزه',23,true],...groups.map(g=>[`${g.a}     ${g.d} از ${g.n}`,18,false]),['',18,false],['کارهای این دوره',23,true],...all.map(t=>[`${t.done?'✓':'○'} ${t.title}   ·   ${t.area}   ·   ${pers(t.date,{dateStyle:'medium'})}`,17,false])];c.width=w;c.height=Math.max(440,90+lines.length*line);ctx.fillStyle='#f7f7f2';ctx.fillRect(0,0,w,c.height);ctx.direction='rtl';ctx.textAlign='right';let y=56;for(let [text,size,bold] of lines){ctx.font=`${bold?'bold ':''}${size}px Tahoma, Arial`;ctx.fillStyle=bold?'#276b57':'#283832';ctx.fillText(text,w-pad,y);y+=line}let blob=awaitBlob(c);blob.then(async b=>{let file=new File([b],`bano-report-${selected}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'گزارش بانو'})}catch(e){if(e.name==='AbortError')return;showImage(b)}}else showImage(b)})}function awaitBlob(c){return new Promise(r=>c.toBlob(r,'image/png'))}function showImage(blob){let url=URL.createObjectURL(blob);portal.innerHTML=`<div class="overlay" id="imageOverlay"><img src="${url}" alt="گزارش تصویری بانو"><div>برای ذخیره در گوشی، تصویر را لمس طولانی کنید؛ یا دکمهٔ بارگیری را بزنید.</div><button class="btn primary" id="downloadImage">بارگیری تصویر</button><button class="btn soft" id="closeImage">بستن</button></div>`;$('#downloadImage').onclick=()=>download(blob,`bano-report-${selected}.png`);$('#closeImage').onclick=()=>{URL.revokeObjectURL(url);portal.innerHTML=''}}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;picker=false;render()});$('#settingsBtn').onclick=settings;load();render();})();
</script></body></html>
